name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-x86_64:
    name: Linux x86_64 (musl)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      TARGET: x86_64-unknown-linux-musl
      # Compile bundled SQLite with musl; Rust uses its target's bundled runtime.
      CC_x86_64_unknown_linux_musl: musl-gcc

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun 1.4.x
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.x"

      - name: Verify package version
        run: |
          [[ "$(bun --version)" == 1.4.* ]]
          version=$(bun -e 'console.log(Bun.TOML.parse(await Bun.file("Cargo.toml").text()).package.version)')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match Cargo version $version." >&2
            exit 1
          fi
          printf 'PACKAGE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Validate release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: scripts/release-notes.sh "$PACKAGE_VERSION" > /dev/null

      - name: Set up Rust and musl tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup toolchain install stable --profile minimal --target "$TARGET"

      - name: Validate analytics with Bun
        working-directory: scripts
        run: |
          bun install --frozen-lockfile
          bun run --bun typecheck
          bun run test

      - name: Test and build release binary
        run: |
          cargo +stable test --locked --target "$TARGET"
          cargo +stable build --release --locked --target "$TARGET"

      - name: Verify static binary
        run: |
          binary="target/$TARGET/release/keyboard-debouncer"
          test "$("$binary" --version)" = "keyboard-debouncer $PACKAGE_VERSION"
          "$binary" --help > /dev/null
          readelf -l "$binary" > "$RUNNER_TEMP/program-headers.txt"
          readelf -d "$binary" > "$RUNNER_TEMP/dynamic-section.txt"
          if grep -q INTERP "$RUNNER_TEMP/program-headers.txt" || grep -q '(NEEDED)' "$RUNNER_TEMP/dynamic-section.txt"; then
            echo "Expected a static binary without a dynamic loader or shared libraries." >&2
            exit 1
          fi

      - name: Package installation archive
        id: package
        run: |
          package="keyboard-debouncer-v$PACKAGE_VERSION-$TARGET"
          mkdir -p "dist/$package"
          git archive HEAD | tar -xf - -C "dist/$package"
          install -m 755 "target/$TARGET/release/keyboard-debouncer" "dist/$package/keyboard-debouncer"
          cd dist
          archive="$package.tar.gz"
          tar -czf "$archive" "$package"
          sha256sum "$archive" > "$archive.sha256"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-debouncer-linux-x86_64
          path: |
            dist/${{ steps.package.outputs.archive }}
            dist/${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: linux-x86_64
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          scripts/release-notes.sh "${TAG#v}" > notes.md
          version="${TAG#v}"
          version="${version%%+*}"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::$TAG is already published; refusing to replace its assets."
              exit 1
            fi
            gh release edit "$TAG" --notes-file notes.md --prerelease="$prerelease"
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" \
              --notes-file notes.md --prerelease="$prerelease"
          fi

          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false
