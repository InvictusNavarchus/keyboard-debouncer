name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag (for example, v0.4.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  linux-x86_64:
    name: Linux x86_64 (musl)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TARGET: x86_64-unknown-linux-musl
      # Compile bundled SQLite with musl; Rust uses its target's bundled runtime.
      CC_x86_64_unknown_linux_musl: musl-gcc

    steps:
      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v0.4.0." >&2
            exit 1
          fi
          published_tag=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '
            if .draft then error("Release is still a draft")
            elif .immutable then error("Release is immutable; assets cannot be attached")
            else .tag_name end')
          test "$published_tag" = "$RELEASE_TAG"

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Bun 1.4.x
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.x"

      - name: Verify package version
        run: |
          [[ "$(bun --version)" == 1.4.* ]]
          version=$(bun -e 'console.log(Bun.TOML.parse(await Bun.file("Cargo.toml").text()).package.version)')
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match Cargo version $version." >&2
            exit 1
          fi

      - name: Set up Rust and musl tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup toolchain install stable --profile minimal --target "$TARGET"

      - name: Validate analytics with Bun
        working-directory: scripts
        run: |
          bun install --frozen-lockfile
          bun run --bun typecheck
          bun run test

      - name: Test and build release binary
        run: |
          cargo +stable test --locked --target "$TARGET"
          cargo +stable build --release --locked --target "$TARGET"

      - name: Verify static binary
        run: |
          binary="target/$TARGET/release/keyboard-debouncer"
          test "$("$binary" --version)" = "keyboard-debouncer ${RELEASE_TAG#v}"
          "$binary" --help > /dev/null
          readelf -l "$binary" > "$RUNNER_TEMP/program-headers.txt"
          readelf -d "$binary" > "$RUNNER_TEMP/dynamic-section.txt"
          if grep -q INTERP "$RUNNER_TEMP/program-headers.txt" || grep -q '(NEEDED)' "$RUNNER_TEMP/dynamic-section.txt"; then
            echo "Expected a static binary without a dynamic loader or shared libraries." >&2
            exit 1
          fi

      - name: Package installation archive
        id: package
        run: |
          package="keyboard-debouncer-$RELEASE_TAG-$TARGET"
          mkdir -p "dist/$package"
          git archive HEAD | tar -xf - -C "dist/$package"
          install -m 755 "target/$TARGET/release/keyboard-debouncer" "dist/$package/keyboard-debouncer"
          cd dist
          archive="$package.tar.gz"
          tar -czf "$archive" "$package"
          sha256sum "$archive" > "$archive.sha256"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release upload "$RELEASE_TAG" "dist/$ARCHIVE" "dist/$ARCHIVE.sha256"
